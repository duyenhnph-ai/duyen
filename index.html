<style>

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

header{text-align:center;margin-bottom:28px}
.tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}

.fmt td,.fmt th{border:1px solid var(--line);padding:5px 8px;text-align:left}
.fmt th{color:var(--grn);font-weight:600}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:11px 22px;background:var(--grn);color:var(--bg);font-weight:600;transition:.15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--grn)}
.btn:focus-visible,.opt:focus-visible,.fc:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.center{text-align:center}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.menu{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);transition:.15s}
.mode:hover:not(:disabled){border-color:var(--grn);transform:translateY(-1px)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode .e{font-size:24px}.mode b{display:block}.mode span{color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:14px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-bottom:22px;overflow:hidden}
.bar div{height:100%;background:var(--red);transition:width .3s}
.fc{perspective:900px;width:100%;height:340px;background:none;border:0;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .w{font-size:34px;font-weight:600;color:var(--grn)}
.face .hint{color:var(--mut);font-size:13px;margin-top:10px}
.face em{color:var(--mut);margin-top:12px;font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
.q small{color:var(--red);letter-spacing:.12em;text-transform:uppercase;font-size:11px}

.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;color:var(--ink);transition:.15s}
.opt:hover:not(:disabled){border-color:var(--grn)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--red)}
input.t{width:100%;font:inherit;font-size:18px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.fb{min-height:28px;margin:14px 0 0;font-weight:600;text-align:center}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--red)}
.score{font-size:56px;font-weight:600;color:var(--grn);margin:8px 0}
.back{background:none;border:0;color:var(--mut);padding:0}.back:hover{color:var(--ink)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:36px}
.err{color:var(--red);text-align:center;margin-top:12px;font-size:14px}
.meta{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px;color:var(--mut);flex-wrap:wrap}
.pos{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--red);color:var(--red);border-radius:99px;padding:1px 10px}
.ipa{font-family:ui-monospace,Menlo,monospace;font-size:16px}
.spk{margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:14px}.spk:hover{border-color:var(--grn)}
mark{background:transparent;color:var(--red);font-weight:600;border-bottom:2px solid var(--red)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:80px;background:radial-gradient(ellipse at 50% 100%,var(--line),transparent 70%);pointer-events:none;z-index:0}
.cane{height:6px;border-radius:6px;margin:20px auto 0;max-width:220px;background:repeating-linear-gradient(135deg,var(--red) 0 8px,var(--card) 8px 16px);border:1px solid var(--line)}
.bar div{background:repeating-linear-gradient(135deg,var(--red) 0 10px,var(--card) 10px 20px)!important}
.mode:nth-child(odd){border-left:4px solid var(--red)}.mode:nth-child(even){border-left:4px solid var(--grn)}
.face{border-top:4px solid var(--red)}.face.back{border-top-color:var(--grn)}
.drop{border-style:dashed;border-color:var(--red);background:linear-gradient(var(--card),var(--card)) padding-box}
.drop:hover,.drop.on{border-color:var(--grn)}
.trees{font-size:20px;letter-spacing:.45em;margin-bottom:6px}
h1 .st{display:inline-block;animation:tw 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){h1 .st{animation:none}}
.fly{position:fixed;top:46px;left:0;font-size:26px;white-space:nowrap;pointer-events:none;z-index:2;opacity:.9;animation:fly 32s linear infinite;transform:translateX(105vw)}
@keyframes fly{from{transform:translateX(105vw) translateY(0)}50%{transform:translateX(40vw) translateY(-10px)}to{transform:translateX(-220px) translateY(0)}}
.bn{display:inline-block;animation:bn 2.2s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-4px) rotate(-6deg)}}
.trees{font-size:28px;letter-spacing:.3em}
.mt{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:13px}.mt:hover{border-color:var(--grn)}
@media (prefers-reduced-motion:reduce){.fly{display:none}.bn{animation:none}}
.lights{display:flex;justify-content:space-around;position:relative;z-index:1;margin:0 -12px 8px;height:34px;overflow:hidden}
.lights::before{content:"";position:absolute;left:0;right:0;top:-6px;height:20px;border-bottom:2px solid var(--line);border-radius:0 0 50% 50%/0 0 100% 100%}
.lights i{width:10px;height:15px;border-radius:50% 50% 50% 50%/35% 35% 65% 65%;margin-top:12px;animation:tw 2.4s ease-in-out infinite}
.lights i:nth-child(4n+1){background:var(--red)}.lights i:nth-child(4n+2){background:#d9a441}.lights i:nth-child(4n+3){background:var(--grn)}.lights i:nth-child(4n){background:#e9e4d6}
@keyframes tw{50%{opacity:.3}}
.count{display:inline-block;margin-top:12px;font-size:13px;color:var(--grn);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 14px}
@media (prefers-reduced-motion:reduce){.lights i{animation:none}}
.tb{border-collapse:collapse;width:100%;font-size:13px;text-align:left}.tb th,.tb td{border-bottom:1px solid var(--line);padding:8px 8px;white-space:nowrap}.tb th{color:var(--grn);font-weight:600}
.word{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0 18px}
.ch{min-width:30px;height:46px;line-height:46px;text-align:center;font-size:26px;font-weight:600;color:var(--grn)}
.sp{width:16px}
.ml{width:38px;height:46px;text-align:center;font:inherit;font-size:24px;font-weight:600;border:0;border-bottom:2px solid var(--red);background:var(--card);color:var(--ink);border-radius:8px 8px 0 0;padding:0}
.ml.ok{background:var(--okbg);border-color:var(--ok)}.ml.bad{background:var(--badbg)}
[hidden]{display:none!important}
</style></head><body>
<div class="snow" id="snow" aria-hidden="true"></div>
<div class="fly" aria-hidden="true">🦌🦌🛷🎅</div>
<main>
<div class="lights" id="lt" aria-hidden="true"></div>
<header><div class="tag">❄ Merry Christmas 2026 ❄</div><h1><span class="st">🎄</span> Vocab <span>Advent</span> <span class="bn">🎅</span></h1><p class="sub">Drop your Excel file. Start practising in seconds.</p><div class="count" id="cd">🎅 33 days until Christmas</div><div class="cane" aria-hidden="true"></div></header>
<div id="app"></div>
<div class="foot"><div class="trees" aria-hidden="true">🎄 🎁 🎅 🦌 🎁 🎄</div>Happy holidays — keep learning, one word at a time 🎄</div>
</main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let words=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
function toWords(rows){
 const h=rows[0].map(norm);
 let iw=h.findIndex(x=>/word|term|vocab/.test(x)),id=h.findIndex(x=>/defin|mean/.test(x)),ie=h.findIndex(x=>/exam|sent/.test(x)),ip=h.findIndex(x=>/type|pos|part|speech|class/.test(x)),ir=h.findIndex(x=>/pron|ipa|phon/.test(x)),iv=h.findIndex(x=>/viet|translat/.test(x));
 let start=1;
 if(iw<0&&id<0){iw=0;id=1;ie=2;ip=ir=iv=-1;start=0}
 else{if(iw<0)iw=0;if(id<0)id=iw===1?0:1;if(ie<0)ie=[0,1,2,3,4].find(k=>![iw,id,ip,ir,iv].includes(k)&&k<h.length)}
 return rows.slice(start).map(r=>({w:String(r[iw]||'').trim(),d:String(r[id]||'').trim(),e:String(r[ie]??'').trim(),p:String(r[ip]??'').trim(),ipa:String(r[ir]??'').trim(),vi:String(r[iv]??'').trim()})).filter(x=>x.w&&x.d).map(x=>({...x,b:blank(x)}));
}
function blank(x){
 if(!x.e)return '';
 const stem=x.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp('\\b'+stem+'\\w*','i');
 return re.test(x.e)?x.e.replace(re,'_____'):'';
}
function load(file){
 const r=new FileReader();
 r.onload=e=>{try{
  const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()));
  words=toWords(rows);
  if(words.length<2)throw 0;
  menu();
 }catch(_){$('#err').textContent='We couldn’t read any words. Please check the file format below.'}};
 r.readAsArrayBuffer(file);
}
let cur='',db=null,uid=null,who=null,store=null,isT=false,tmr;
const MODES=['Match the definition','Type the word','Missing letters','Complete the sentence'];
const rec=()=>{if(!store||!who)return null;const k=who+(list?' · '+list:'');return store.students[k]=store.students[k]||{fc:{seen:[]},res:{}}};
function save(now){clearTimeout(tmr);const go=async()=>{if(!db||!uid||!store)return;const r=rec();if(r)r.t=Date.now();try{await db.doc('progress/'+uid).set(store)}catch(_){}};now?go():tmr=setTimeout(go,1500)}
function logFc(n,miss){const r=rec();if(!r)return;r.fc.known=n-miss.length;r.fc.review=miss.map(x=>x.w);r.fc.total=words.length;r.fc.rounds=(r.fc.rounds||0)+1;save(1)}
function logRes(s,n,miss){const r=rec();if(!r||cur==='Flashcards')return;const x=r.res[cur]=r.res[cur]||{attempts:0,best:0};x.attempts++;x.last=Math.round(s/n*100);x.best=Math.max(x.best,x.last);x.wrong=miss.map(w=>w.w).slice(0,60);x.t=Date.now();save(1)}
function ask(next){
 if(!window.claude){who='Student';store={students:{}};rec();next();return}
 let last='';try{last=localStorage.getItem('vname')||''}catch(_){}
 app.innerHTML=`<div class="center"><div class="ico">\u270f\ufe0f</div><h2 style="margin:4px 0">What\u2019s your name?</h2><p class="sub">Your teacher will see your progress.</p><div style="max-width:320px;margin:18px auto 0"><input class="t" id="nm" maxlength="40" placeholder="Full name" autocomplete="name" value="${esc(last)}"></div><div class="fb" id="fb" role="alert"></div><div class="row"><button class="btn ghost" id="b">Back</button><button class="btn" id="go">Start</button></div></div>`;
 const go=async()=>{const v=$('#nm').value.trim().replace(/\s+/g,' ');if(!v){$('#fb').className='fb bad';$('#fb').textContent='Please enter your name.';return}
  who=v;try{localStorage.setItem('vname',v)}catch(_){}
  store={students:{}};
  if(db&&uid){try{const sn=await db.doc('progress/'+uid).get();if(sn.exists&&sn.data().students)store=sn.data()}catch(_){}}
  rec();next()};
 $('#go').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};$('#b').onclick=menu;$('#nm').focus();
}
function dash(){
 app.innerHTML='<div class="top"><button class="back" id="m">\u2190 Menu</button><span>Teacher dashboard</span></div><div id="dt" class="sub center">Loading\u2026</div>';
 let un=null;$('#m').onclick=()=>{un&&un();menu()};
 un=db.collection('progress').onSnapshot(snap=>{
  const rows=[];snap.docs.forEach(d=>{const st=(d.data()||{}).students||{};for(const k in st)rows.push([k,st[k]])});
  rows.sort((a,b)=>(b[1].t||0)-(a[1].t||0));
  $('#dt').className='';
  $('#dt').innerHTML=rows.length?`<div style="overflow-x:auto"><table class="tb"><tr><th>Student</th><th>Flashcards (flipped)</th><th>Match</th><th>Type</th><th>Missing letters</th><th>Sentences</th><th>Last active</th></tr>${rows.map(([k,x])=>{const fc=x.fc||{seen:[]};return `<tr><td><b>${esc(k)}</b></td><td>${fc.seen.length}/${fc.total||words.length}${fc.known!=null?` \u00b7 ${fc.known} known`:''}</td>${MODES.map(m=>{const r=(x.res||{})[m];return `<td title="${r?esc('Missed last time: '+(r.wrong||[]).join(', ')):''}">${r?`${r.best}% best \u00b7 ${r.last}% last (${r.attempts}\u00d7)`:'\u2014'}</td>`}).join('')}<td>${x.t?esc(new Date(x.t).toLocaleString()):'\u2014'}</td></tr>`}).join('')}</table></div><p class="sub" style="font-size:12px;margin-top:10px">Updates live. Hover a score to see the words missed last time.</p>`:'<p class="sub center">No student activity yet.</p>';
 },()=>{$('#dt').textContent='Could not load progress.'});
}
const CANON='https://claude.ai/artifact/QDZihTDmJh9MVfViXqbZoN';
const RES=['settings','sidebar','customize','upgrade','downloads'];
const okSlug=s=>/^[a-z0-9-]{3,40}$/.test(s)&&!RES.includes(s)&&!s.startsWith('comment-');
let list=okSlug(location.hash.slice(1))?location.hash.slice(1):'';
const mkWords=a=>a.map(r=>{const x={w:r[0],p:r[1],ipa:r[2],d:r[3],e:r[4],vi:r[5]||''};x.b=blank(x);return x});
async function fromList(s){
 list=s;app.innerHTML='<div class="center"><p class="sub">Loading your list\u2026</p></div>';
 try{const sn=await db.doc('lists/'+s).get();if(sn.exists&&sn.data().words){words=mkWords(sn.data().words);if(words.length){menu();return}}}catch(_){}
 app.innerHTML='<div class="center"><div class="ico">\U0001F50E</div><p class="sub">We couldn\u2019t find this vocabulary list. Please check the link with your teacher.</p><div class="row"><button class="btn ghost" id="h">Upload a file instead</button></div></div>';$('#h').onclick=()=>{list='';home()};
}
function pubAsk(){
 app.innerHTML=`<div class="center"><div class="ico">\U0001F4E4</div><h2 style="margin:4px 0">Name this list</h2><p class="sub">Each name gets its own link, e.g. grade6-unit1. Use letters, numbers and hyphens.</p><div style="max-width:320px;margin:18px auto 0"><input class="t" id="ln" maxlength="40" placeholder="grade6-unit1" value="${esc(list)}" autocapitalize="off" spellcheck="false"></div><div class="fb" id="fb" role="alert"></div><div class="row"><button class="btn ghost" id="b">Back</button><button class="btn" id="go">Publish</button></div></div>`;
 const err=t=>{$('#fb').className='fb bad';$('#fb').textContent=t};
 const go=async()=>{const s=$('#ln').value.trim().toLowerCase();if(!okSlug(s)){err('Use 3\u201340 letters, numbers or hyphens.');return}
  const data={name:s,words:words.map(x=>[x.w,x.p||'',x.ipa||'',x.d,x.e||'',x.vi||'']),t:Date.now()};
  if(JSON.stringify(data).length>240000){err('This list is too large to publish.');return}
  $('#go').disabled=true;
  try{await db.doc('lists/'+s).set(data);list=s;linkScreen(s)}catch(_){$('#go').disabled=false;err('Could not publish \u2014 try again.')}};
 $('#go').onclick=go;$('#ln').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};$('#b').onclick=menu;$('#ln').focus();
}
function linkScreen(s){
 const u=CANON+'#'+s;
 app.innerHTML=`<div class="center"><div class="ico">\U0001F381</div><h2 style="margin:4px 0">Published! (${words.length} words)</h2><p class="sub">Send this link to your students:</p><div style="max-width:480px;margin:14px auto 0"><input class="t" id="lk" readonly value="${esc(u)}" style="font-size:14px"></div><div class="row"><button class="btn" id="cp">Copy link</button><button class="btn ghost" id="m">Back to menu</button></div><div class="fb" id="fb"></div></div>`;
 $('#lk').onfocus=e=>e.target.select();$('#m').onclick=menu;
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(u);$('#fb').className='fb ok';$('#fb').textContent='Copied!'}catch(_){$('#lk').select();$('#fb').className='fb';$('#fb').textContent='Press Ctrl+C (or \u2318C) to copy the link.'}};
}
async function lists(){
 app.innerHTML='<div class="top"><button class="back" id="m">\u2190 Menu</button><span>My lists</span></div><div id="dt" class="sub center">Loading\u2026</div>';
 $('#m').onclick=()=>words.length?menu():home();
 try{
  const sn=await db.collection('lists').get();
  const rows=sn.docs.map(d=>{const x=d.data()||{};return{id:d.id,n:(x.words||[]).length,t:x.t||0}}).sort((a,b)=>b.t-a.t);

      &lt;script&gt;
        
    function nlSend(){
      var wrap=document.querySelector('.nl-wrap'),boxes=[];
      for(var i=0;i&lt;wrap.children.length;i++){
        var c=wrap.children[i];
        if(!c.offsetWidth||!c.offsetHeight)continue;
        boxes.push({x:c.offsetLeft-wrap.offsetLeft+8,
                    y:c.offsetTop-wrap.offsetTop+8,
                    w:c.offsetWidth,h:c.offsetHeight});
      }
      parent.postMessage({nlHud:'resize',
        width:wrap.offsetWidth+26,
        height:wrap.offsetHeight+26,
        boxes:boxes},'*');
    }
    function nlSendSoon(){requestAnimationFrame(nlSend);}
    window.addEventListener('load',nlSend);
    window.addEventListener('message',function(e){
      if(e.source!==parent||!e.data||e.data.nlHud!=='viewport')return;
      var s=document.documentElement.style;
      s.setProperty('--nl-vw',e.data.w+'px');
      s.setProperty('--nl-vh',e.data.h+'px');
      document.documentElement.classList.toggle('nl-narrow',e.data.w&lt;600);
      nlSendSoon();
    });
    var nlCoarse=window.matchMedia('(pointer: coarse)').matches;
    function nlSubmit(form){
      if(form.requestSubmit)return form.requestSubmit();
      if(form.checkValidity&amp;&amp;!form.checkValidity())
        return form.reportValidity&amp;&amp;form.reportValidity();
      form.submit();
    }
  
        var badge=document.getElementById('nl-badge'),card=document.getElementById('nl-card'),
            box=card.querySelector('textarea');
        function setOpen(open){
          card.classList.toggle('open',open);
          badge.setAttribute('aria-expanded',open?'true':'false');
          nlSendSoon();
          if(open&amp;&amp;!nlCoarse)box.focus();
        }
        box.addEventListener('keydown',function(e){
          if(e.key==='Enter'&amp;&amp;!e.shiftKey){e.preventDefault();nlSubmit(box.form);}
        });
        badge.addEventListener('click',function(){setOpen(!card.classList.contains('open'));});
        document.getElementById('nl-card-close').addEventListener('click',function(){setOpen(false);badge.focus();});
        document.addEventListener('keydown',function(e){
          if(e.key==='Escape'&amp;&amp;card.classList.contains('open')){setOpen(false);badge.focus();}
        });
        card.addEventListener('click',function(e){
          if(e.target.closest('#nl-hide'))parent.postMessage({nlHud:'state',value:'hidden'},'*');
        });
